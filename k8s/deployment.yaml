apiVersion: apps/v1
kind: Deployment
metadata:
  name: melinastutz-com
  namespace: apps
  labels:
    app: melinastutz-com
spec:
  # Stateless static site: two replicas, so a node reboot (the amd64 nodes
  # reboot periodically) never takes it offline. See pdb.yaml.
  replicas: 2
  selector:
    matchLabels:
      app: melinastutz-com
  template:
    metadata:
      labels:
        app: melinastutz-com
    spec:
      automountServiceAccountToken: false
      # Spread the replicas over nodes when possible.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: melinastutz-com
      # Prefer worker nodes, keep load off the control plane.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      # UID/GID 101 = nginx in nginxinc/nginx-unprivileged; numeric so the
      # kubelet can verify runAsNonRoot.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: melinastutz-com
          # Image tag is managed by Flux CD image automation (ImagePolicy
          # ^main-[0-9]{8}T[0-9]{6}$); Flux commits new tags to main here.
          image: ghcr.io/melinastutz8-glitch/melinastutz-com:main-00000000T000000 # {"$imagepolicy": "flux-system:melinastutz-com"}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # nginx writes only its pid file and temp files, all under /tmp
          # (set by the image's nginx.conf).
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
