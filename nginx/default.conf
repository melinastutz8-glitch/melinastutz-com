# nginx server config for the static export in /usr/share/nginx/html.
#
# Replaces the image's /etc/nginx/conf.d/default.conf, which nginx.conf
# includes INSIDE `http {}`: only `server`, `map` and other http-level
# directives belong here. The image's own nginx.conf stays untouched: it puts
# the pid file and every *_temp_path under /tmp, which is what lets the pod
# run with a read-only root filesystem and only /tmp writable.
#
# TLS ends at Cloudflare; the pod speaks plain HTTP on 8080 behind the
# Cloudflare tunnel (DEPLOYMENT.md, "Contract").

# Cache-Control per path class. The default is `no-cache` (revalidate every
# time): HTML, the RSC `*.txt` payloads, robots.txt, sitemap.xml, llms.txt and
# every redirect response, so a browser never caches a redirect for a day.
# The first matching regex wins, so hashed `/_next/static/` files (fonts
# included) are immutable even though they also end in `.woff2`.
map $uri $cache_control {
    default                                                       "no-cache";
    ~^/_next/static/                                              "public, max-age=31536000, immutable";
    ~*\.(?:png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf)$       "public, max-age=86400";
}

server {
    # IPv4 only: a `listen [::]` fails to start in pods and containers where
    # IPv6 is disabled, and the tunnel reaches the Service over IPv4.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No version in the Server header or error pages.
    server_tokens off;
    # Redirects carry a relative Location (`/de/cv/`), never
    # `http://<pod>:8080/…`, which would be wrong behind the tunnel.
    absolute_redirect off;
    port_in_redirect off;

    charset utf-8;
    charset_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    # ── Response headers ──
    # nginx trap: an `add_header` inside a `location` drops every `add_header`
    # of this server block for that location. So no location below sets
    # headers; they all inherit this list. The CI smoke test checks the
    # headers on HTML, /_next/static/, a redirect and the 404 page.
    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Start with one day, without includeSubDomains/preload; Dominic raises it
    # once the site is stable (DEPLOYMENT.md, "Security headers").
    add_header Strict-Transport-Security "max-age=86400" always;
    # Enforced part: things the site never needs.
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    # Report-only part: the full allow-list, observed before it is enforced
    # ('unsafe-inline' for Next's inline bootstrap scripts and styles).
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'" always;

    # The export uses Next's own 404 page (out/404.html).
    error_page 404 /404.html;

    # Bare domain → default locale. Relative Location, `no-cache` from the map.
    location = / {
        return 302 /de/;
    }

    # Liveness/readiness/startup probes.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Hidden files (/.git, /.env, …) are never served; /.well-known/ is.
    location ~ /\.(?!well-known(?:/|$)) {
        return 404;
    }

    location / {
        # `$uri/` makes a directory request without trailing slash answer
        # with a 301 to the slash variant (`/de/cv` → `/de/cv/`), which then
        # serves its index.html. `$uri.html` covers files like /404.html
        # requested without the extension.
        try_files $uri $uri/ $uri.html =404;
    }
}
