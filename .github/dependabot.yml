# Not covered here: the BuildKit daemon image pinned via `driver-opts` in
# ci.yml and build.yml (moby/buildkit tag + digest). Dependabot does not
# track it; bump it by hand.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-minor-and-patch:
        update-types: ["minor", "patch"]

  # Base images in the Dockerfile (tag + digest).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Node majors are a deliberate manual change. When the node tag moves,
      # bump `node-version` in ci.yml and build.yml and `.nvmrc` in the same PR.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      # Stay on nginx stable: odd minors (1.31.x) are mainline, and a stable
      # minor jump (1.30 → 1.32) is done by hand. Patches still come in.
      - dependency-name: "nginx/nginx-unprivileged"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
