name: CI

# Pull requests and work branches. main has its own workflow (build.yml).
on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      # The contact address reaches visitors only through the browser, never
      # the exported HTML, the RSC payloads or the client chunks. The patterns
      # keep the literal out of the repo. grep exits 1 when nothing matches;
      # a match (0) or an error (2) fails the step.
      - name: Contact address absent from out/
        run: |
          rc=0
          grep -rIil -e 'info[@]melinastutz' -e 'info \[at\] melinastutz' out || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "::error::contact address in the build output, or grep failed (exit $rc)"
            exit 1
          fi
      - name: Validate k8s manifests (kustomize + kubeconform, pinned)
        run: scripts/validate-k8s.sh

  # Builds the image (amd64 only, never pushed) and smoke-tests it the way the
  # cluster runs it, so Dockerfile, nginx and base-image changes fail on the
  # PR instead of on main.
  image:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Pull docker.io content through Google's Docker Hub mirror first
          # (anonymous Docker Hub pulls from shared runners hit 429). Keep in
          # sync with build.yml.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        timeout-minutes: 15
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: melinastutz-com:ci
          # Read-only reuse of main's layer cache; PRs never write it.
          cache-from: type=gha,scope=build
      - name: Smoke test (read-only rootfs, UID 101)
        run: scripts/smoke-test.sh melinastutz-com:ci
