name: Build and Push

# Every push to main builds the multi-arch image and pushes it to GHCR with a
# `main-<UTC timestamp>` tag, which Flux picks up. Changes under k8s/ do not
# build: Flux commits its image-tag updates there, directly on main.
on:
  push:
    branches: [main]
    paths-ignore: ['k8s/**']

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # Fixed and lowercase on purpose (GHCR rejects uppercase); do not derive it
  # from github.repository_owner.
  IMAGE_NAME: melinastutz8-glitch/melinastutz-com

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      # Computed once per run; Flux ImagePolicy: ^main-[0-9]{8}T[0-9]{6}$
      ts: ${{ steps.ts.outputs.ts }}
    steps:
      - id: ts
        run: echo "ts=$(date -u +%Y%m%dT%H%M%S)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Contact address absent from out/
        run: |
          rc=0
          grep -rIil -e 'info[@]melinastutz' -e 'info \[at\] melinastutz' out || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "::error::contact address in the build output, or grep failed (exit $rc)"
            exit 1
          fi
      - name: Validate k8s manifests (kustomize + kubeconform, pinned)
        run: scripts/validate-k8s.sh
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Build image for the smoke test (amd64, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        timeout-minutes: 15
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: melinastutz-com:verify
          cache-from: type=gha,scope=build
      - name: Smoke test (read-only rootfs, UID 101)
        run: scripts/smoke-test.sh melinastutz-com:verify

  build:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Same registry mirror as ci.yml. Keep in sync.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main-${{ needs.verify.outputs.ts }},enable={{is_default_branch}}
            type=sha,prefix=
      # One Buildx job for both platforms without QEMU: the build stage runs
      # on $BUILDPLATFORM (amd64 runner) and the runtime stage only COPYs.
      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        timeout-minutes: 20
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=build
          cache-to: type=gha,scope=build,mode=max
      - name: Verify both platforms in the manifest list
        shell: bash
        env:
          TAG: main-${{ needs.verify.outputs.ts }}
        run: |
          ref="${REGISTRY}/${IMAGE_NAME}:${TAG}"
          docker buildx imagetools inspect "$ref"
          # Attestation manifests appear as unknown/unknown and are ignored.
          platforms=$(docker buildx imagetools inspect --raw "$ref" \
            | jq -r '[.manifests[].platform | select(.os != "unknown") | .os + "/" + .architecture] | sort | join(",")')
          echo "Platforms: $platforms"
          if [ "$platforms" != "linux/amd64,linux/arm64" ]; then
            echo "::error::Expected linux/amd64,linux/arm64 in $ref" >&2
            exit 1
          fi
          echo "### Image pushed: \`$ref\`" >> "$GITHUB_STEP_SUMMARY"
